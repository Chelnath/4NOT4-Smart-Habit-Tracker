<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow Pro - Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { teal: { DEFAULT: '#2a7d7b', light: '#3a9593' }, salmon: { DEFAULT: '#e8a09a', dark: '#d58c86' }, accentRed: '#c0392b', lightBg: '#f8f9fa' } } } }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
    <style>
      body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      th, td { border: 1px solid #e5e7eb; }
      th { font-weight: 600; color: #374151; }
      @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      .float-xp { animation: floatUp 1s ease-out forwards; position: fixed; font-weight: bold; pointer-events: none; z-index: 9999; color: #2a7d7b; font-size: 1.1rem; }
      .pulse-glow { animation: pulseGlow 1.5s infinite; }
      .toast-enter { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="error-log" style="color:red;padding:20px;font-weight:bold;white-space:pre-wrap;"></div>
    <script>
      window.addEventListener('error', function(e) { document.getElementById('error-log').innerText += '\n[JS Error]: ' + e.message + ' at line ' + e.lineno; });
      window.addEventListener('unhandledrejection', function(e) { document.getElementById('error-log').innerText += '\n[Promise]: ' + (e.reason && e.reason.message ? e.reason.message : e.reason); });
    </script>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useCallback, useRef } = React;
      const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts || {};

      const defaultHabitNames = ["Wake Up (4AM)","Shilajit","500ml Water","CAT 2 Prep","Bath","3 Egg Morning","Proper Lunch Meal","Pre Workout","Gym","Post Workout Shake","Assignments/Pendings","MBA Prep","PCB Design","Read Book/Newspaper","Protein Dinner","Sleep 6Hrs"];
      const INITIAL_HABITS = defaultHabitNames.map((n,i) => ({ id: `h_init_${i}`, name: n, goal: 10, verificationMode: "Manual", locationData: null }));

      const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const getDayOfWeek = (year, month, day) => dayNames[new Date(year, month, day).getDay()];
      const getWeekGroupings = (year, month) => {
        const days = getDaysInMonth(year, month);
        const weeks = [];
        let currentWeek = [];
        for (let day = 1; day <= days; day++) {
          currentWeek.push(day);
          if (currentWeek.length === 7 || day === days) {
            weeks.push({ label: `Wk ${weeks.length + 1}`, days: [...currentWeek] });
            currentWeek = [];
          }
        }
        return weeks;
      };
      const getProgressColor = p => p < 33 ? '#c0392b' : p < 66 ? '#e8a09a' : '#2a7d7b';

      const haversine = (lat1, lon1, lat2, lon2) => {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180;
        const a = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      };

      async function analyzeFoodPhoto(file, apiKey) {
        return new Promise((resolve, reject) => {
          if (!apiKey) return reject("Anthropic API key missing. Configure in Settings.");
          const reader = new FileReader();
          reader.onloadend = async () => {
            const base64 = reader.result.split(',')[1];
            try {
              const res = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
                body: JSON.stringify({
                  model: "claude-sonnet-4-20250514", max_tokens: 300,
                  system: 'You are a food verification AI. Analyse the image and respond ONLY with valid JSON: { "isHealthy": true/false, "foodDetected": true/false, "confidence": 0-100, "foodName": "string", "reason": "string" }. Junk food, fast food, chips, soda, candy, pizza, burgers = NOT healthy. Whole foods, proteins, vegetables, fruits, eggs, rice, dal = healthy.',
                  messages: [{ role: "user", content: [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } }, { type: "text", text: "Is this healthy food?" }] }]
                })
              });
              if (!res.ok) throw new Error("API call failed: " + res.status);
              const data = await res.json();
              const text = data.content.map(b => b.text || '').join('');
              const clean = text.replace(/```json|```/g,'').trim();
              resolve(JSON.parse(clean));
            } catch (e) { reject(e.message || "Parse failed"); }
          };
          reader.onerror = () => reject("File read error");
          reader.readAsDataURL(file);
        });
      }

      // Icons
      const CheckIcon = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
      const TrashIcon = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
      const PlusIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
      const ChevronLeftIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
      const ChevronRightIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;

      // ─── LevelDisplay ───────────────────────────────────────────────────────────
      function LevelDisplay({ xpData }) {
        const xp = xpData ? xpData.xp || 0 : 0;
        const badges = xpData ? xpData.badges || [] : [];
        const lvl = xp < 500 ? 1 : xp < 1500 ? 2 : xp < 3000 ? 3 : xp < 5000 ? 4 : 5;
        const nXp = [null,500,1500,3000,5000,null][lvl];
        const pXp = [0,0,500,1500,3000,5000][lvl];
        const prog = nXp ? ((xp - pXp) / (nXp - pXp)) * 100 : 100;
        const badgeIcon = b => b==='Early Bird'?'🌅':b==='Iron Discipline'?'⚔️':b==='Century Club'?'💯':'🏅';
        return (
          <div className="flex items-center gap-3 bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-200">
            <div className="font-black text-teal text-xl">Lv{lvl}</div>
            <div className="flex flex-col w-28">
              <div className="flex justify-between text-xs font-bold text-gray-600">
                <span>{xp} XP</span>
                {nXp && <span className="text-gray-400">{nXp}</span>}
              </div>
              <div className="w-full h-2 bg-gray-200 rounded-full mt-1 overflow-hidden">
                <div className="h-full bg-teal transition-all" style={{width:`${Math.min(100,prog)}%`}}></div>
              </div>
            </div>
            {badges.length > 0 && (
              <div className="flex gap-1 border-l pl-3">
                {badges.map(b => <span key={b} title={b} className="text-lg cursor-help">{badgeIcon(b)}</span>)}
              </div>
            )}
          </div>
        );
      }

      // ─── useAppStore ─────────────────────────────────────────────────────────────
      function useAppStore() {
        const [currentMonth, setCurrentMonth] = useState(() => {
          const n = new Date();
          return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
        });
        const [globalHabits, setGlobalHabits] = useState(() => {
          try { return JSON.parse(localStorage.getItem('habitTrackerGlobal_v1')) || INITIAL_HABITS; } catch(e) { return INITIAL_HABITS; }
        });
        const [monthlyData, setMonthlyData] = useState({});
        const [teamMembers, setTeamMembers] = useState(() => {
          try { return JSON.parse(localStorage.getItem('teamMembers_v1')) || []; } catch(e) { return []; }
        });
        const [teamMonthlyData, setTeamMonthlyData] = useState({});
        const [xpData, setXpData] = useState(() => {
          try { return JSON.parse(localStorage.getItem('xpData_v1')) || { myself: { xp: 0, badges: [], totalCompletions: 0 } }; } catch(e) { return { myself: { xp: 0, badges: [], totalCompletions: 0 } }; }
        });
        const [appConfig, setAppConfig] = useState(() => {
          try { return JSON.parse(localStorage.getItem('appConfig_v1')) || { anthropicApiKey: "", googleFitConnected: false }; } catch(e) { return { anthropicApiKey: "", googleFitConnected: false }; }
        });
        const [pendingApprovals, setPendingApprovals] = useState(() => {
          try { return JSON.parse(localStorage.getItem('pendingApprovals_v1')) || []; } catch(e) { return []; }
        });
        const [nudges, setNudges] = useState(() => {
          try { return JSON.parse(localStorage.getItem('nudges_v1')) || []; } catch(e) { return []; }
        });
        const [prevRanks, setPrevRanks] = useState(() => {
          try { return JSON.parse(localStorage.getItem('prevRanks_v1')) || {}; } catch(e) { return {}; }
        });

        useEffect(() => {
          try { setMonthlyData(JSON.parse(localStorage.getItem(`habitData_${currentMonth}`)) || {}); } catch(e) { setMonthlyData({}); }
          try { setTeamMonthlyData(JSON.parse(localStorage.getItem(`teamData_${currentMonth}`)) || {}); } catch(e) { setTeamMonthlyData({}); }
        }, [currentMonth]);

        useEffect(() => { localStorage.setItem('habitTrackerGlobal_v1', JSON.stringify(globalHabits)); }, [globalHabits]);
        useEffect(() => { localStorage.setItem(`habitData_${currentMonth}`, JSON.stringify(monthlyData)); }, [monthlyData, currentMonth]);
        useEffect(() => { localStorage.setItem(`teamData_${currentMonth}`, JSON.stringify(teamMonthlyData)); }, [teamMonthlyData, currentMonth]);
        useEffect(() => { localStorage.setItem('teamMembers_v1', JSON.stringify(teamMembers)); }, [teamMembers]);
        useEffect(() => { localStorage.setItem('xpData_v1', JSON.stringify(xpData)); }, [xpData]);
        useEffect(() => { localStorage.setItem('appConfig_v1', JSON.stringify(appConfig)); }, [appConfig]);
        useEffect(() => { localStorage.setItem('pendingApprovals_v1', JSON.stringify(pendingApprovals)); }, [pendingApprovals]);
        useEffect(() => { localStorage.setItem('nudges_v1', JSON.stringify(nudges)); }, [nudges]);
        useEffect(() => { localStorage.setItem('prevRanks_v1', JSON.stringify(prevRanks)); }, [prevRanks]);

        useEffect(() => {
          const t = setInterval(() => {
            try { setPendingApprovals(JSON.parse(localStorage.getItem('pendingApprovals_v1')||'[]')); } catch(e){}
            try { setNudges(JSON.parse(localStorage.getItem('nudges_v1')||'[]')); } catch(e){}
          }, 5000);
          return () => clearInterval(t);
        }, []);

        const calcGamification = useCallback((userId, habitId, dayNum, isChecked, wasChecked, monthStateLocal) => {
          let gainedXP = 0;
          setXpData(prevXp => {
            const userXp = prevXp[userId] || { xp: 0, badges: [], totalCompletions: 0 };
            let newXp = userXp.xp + (isChecked ? 10 : -10);
            gainedXP = isChecked ? 10 : 0;
            let newTotal = Math.max(0, (userXp.totalCompletions || 0) + (isChecked ? 1 : -1));
            let newBadges = [...(userXp.badges || [])];

            const allCount = globalHabits.length;
            if (allCount > 0) {
              let cNow = 0;
              globalHabits.forEach(h => { if (monthStateLocal[h.id]?.[dayNum]) cNow++; });
              const pNow = cNow === allCount;
              const pBefore = isChecked ? (cNow - 1 === allCount) : (cNow + 1 === allCount);
              if (!pBefore && pNow) { newXp += 50; gainedXP += 50; }
              if (pBefore && !pNow) newXp -= 50;

              const hDays = monthStateLocal[habitId] || {};
              let streak = 0;
              for (let d = dayNum; d >= 1; d--) { if (hDays[d]) streak++; else break; }
              if (isChecked && streak === 7) { newXp += 100; gainedXP += 100; }

              if (newTotal >= 100 && !newBadges.includes('Century Club')) newBadges.push('Century Club');
              const theH = globalHabits.find(h => h.id === habitId);
              if (theH && (theH.name.includes("4AM") || theH.name.includes("Wake Up")) && !newBadges.includes('Early Bird') && streak >= 7) newBadges.push('Early Bird');
              if (pNow && !newBadges.includes('Iron Discipline')) {
                let pDays = 0;
                for (let d = dayNum; d > dayNum - 3 && d >= 1; d--) {
                  let c = 0; globalHabits.forEach(h => { if(monthStateLocal[h.id]?.[d]) c++; });
                  if (c === allCount) pDays++;
                }
                if (pDays >= 3) newBadges.push('Iron Discipline');
              }
            }
            return { ...prevXp, [userId]: { xp: Math.max(0, newXp), badges: newBadges, totalCompletions: newTotal } };
          });
          return gainedXP;
        }, [globalHabits]);

        const forceToggleDay = useCallback((habitId, dayNum) => {
          let gained = 0;
          setMonthlyData(prev => {
            const hD = prev[habitId] || {};
            const isChecked = !(hD[dayNum] || false);
            const newState = { ...prev, [habitId]: { ...hD, [dayNum]: isChecked } };
            gained = calcGamification('myself', habitId, dayNum, isChecked, !isChecked, newState);
            return newState;
          });
          return gained;
        }, [calcGamification]);

        const toggleTeamDay = useCallback((mId, hId, dN) => {
          setTeamMonthlyData(prev => {
            const mData = prev[mId] || {};
            const hD = mData[hId] || {};
            const isChecked = !(hD[dN] || false);
            const newMemberState = { ...mData, [hId]: { ...hD, [dN]: isChecked } };
            const newState = { ...prev, [mId]: newMemberState };
            calcGamification(mId, hId, dN, isChecked, !isChecked, newMemberState);
            return newState;
          });
        }, [calcGamification]);

        const updateHabit = useCallback((id, updates) => setGlobalHabits(p => p.map(h => h.id === id ? { ...h, ...updates } : h)), []);
        const addHabit = useCallback(() => setGlobalHabits(p => [...p, { id: `h_${Date.now()}`, name: "New Habit", goal: 10, verificationMode: "Manual", locationData: null }]), []);
        const deleteHabit = useCallback(id => setGlobalHabits(p => p.filter(h => h.id !== id)), []);
        const addTeamMember = useCallback(name => setTeamMembers(p => [...p, { id: `m_${Date.now()}`, name }]), []);
        const removeTeamMember = useCallback(id => setTeamMembers(p => p.filter(m => m.id !== id)), []);

        return { currentMonth, setCurrentMonth, globalHabits, monthlyData, forceToggleDay, updateHabit, addHabit, deleteHabit, teamMembers, teamMonthlyData, toggleTeamDay, addTeamMember, removeTeamMember, xpData, appConfig, setAppConfig, pendingApprovals, setPendingApprovals, nudges, setNudges, prevRanks, setPrevRanks };
      }

      // ─── SettingsTab ─────────────────────────────────────────────────────────────
      function SettingsTab({ appConfig, setAppConfig, globalHabits, updateHabit, addToast, forceToggleDay }) {
        const [apiKey, setApiKey] = useState(appConfig.anthropicApiKey || "");

        const handleSaveAPI = () => { setAppConfig(p => ({ ...p, anthropicApiKey: apiKey })); addToast("API Key Saved!", "success"); };
        const testConnection = async () => {
          if (!apiKey) return addToast("Enter API key first", "warning");
          addToast("Testing connection...", "info");
          try {
            const res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}, body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:10, messages:[{role:"user",content:[{type:"text",text:"hi"}]}] }) });
            if (res.ok) addToast("✅ Connection Successful!", "success"); else addToast("❌ Connection Failed: " + res.status, "error");
          } catch(e) { addToast("❌ Error: " + e.message, "error"); }
        };
        const exportData = () => {
          const obj = {};
          for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); obj[k] = localStorage.getItem(k); }
          const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"})); a.download="habitflow_backup.json"; a.click();
          addToast("Data exported!", "success");
        };
        const resetData = () => { if (window.confirm("This will DELETE all your data. Are you sure?")) { localStorage.clear(); window.location.reload(); } };
        const connectGoogleFit = () => {
          addToast("Simulating Google OAuth...", "info");
          setTimeout(() => { setAppConfig(p => ({...p, googleFitConnected: true})); addToast("✅ Google Fit Connected!", "success"); }, 2000);
        };
        const syncGoogleFit = () => {
          addToast("Syncing health data...", "info");
          setTimeout(() => {
            const d = { steps: Math.floor(Math.random()*8000+4000), sleepHours: parseFloat((Math.random()*3+5.5).toFixed(1)), heartRate: Math.floor(Math.random()*16+62), activeMinutes: Math.floor(Math.random()*70+20) };
            addToast(`Synced: ${d.steps} steps · ${d.sleepHours}hrs sleep · ${d.heartRate}bpm`, "success");
            const today = new Date().getDate();
            globalHabits.forEach(h => {
              if (h.name.toLowerCase().includes("sleep") && d.sleepHours >= 6) {
                if (window.confirm(`Google Fit: ${d.sleepHours}hrs sleep detected. Auto-verify "${h.name}"?`)) forceToggleDay(h.id, today);
              }
            });
          }, 1500);
        };

        return (
          <div className="space-y-6 mt-4">
            <div className="bg-white p-6 rounded-xl shadow border border-gray-200">
              <h3 className="text-xl font-bold mb-6 text-gray-800">⚙️ Settings</h3>

              <div className="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                <h4 className="font-bold text-blue-900 mb-1">🤖 Anthropic AI (Food Verification)</h4>
                <p className="text-xs text-blue-600 mb-3">Your key is stored only in your browser's localStorage and sent directly to Anthropic's API only.</p>
                <div className="flex gap-2">
                  <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-..." className="flex-1 px-3 py-2 border border-blue-300 rounded focus:ring-1 focus:ring-teal outline-none" />
                  <button onClick={handleSaveAPI} className="px-4 py-2 bg-teal text-white rounded font-bold hover:bg-teal-light">Save</button>
                  <button onClick={testConnection} className="px-4 py-2 bg-gray-200 text-gray-700 rounded font-bold hover:bg-gray-300">Test</button>
                </div>
              </div>

              <div className="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                <h4 className="font-bold text-green-900 mb-2">❤️ Google Fit Integration (Simulated)</h4>
                {!appConfig.googleFitConnected
                  ? <button onClick={connectGoogleFit} className="px-4 py-2 bg-green-600 text-white rounded font-bold hover:bg-green-700">Connect Google Fit</button>
                  : <div className="flex items-center gap-4">
                      <span className="text-green-700 font-bold">✅ Connected</span>
                      <button onClick={syncGoogleFit} className="px-4 py-2 bg-green-100 text-green-800 rounded font-bold hover:bg-green-200">Sync Now 🔄</button>
                      <button onClick={()=>setAppConfig(p=>({...p,googleFitConnected:false}))} className="text-sm text-gray-500 underline">Disconnect</button>
                    </div>
                }
              </div>

              <div className="mb-6">
                <h4 className="font-bold text-gray-700 mb-3">🔒 Habit Verification Modes</h4>
                <div className="space-y-2">
                  {globalHabits.map(h => (
                    <div key={h.id} className="flex items-center gap-3 p-3 bg-gray-50 border rounded-lg">
                      <span className="font-medium text-gray-700 flex-1 truncate">{h.name}</span>
                      <select value={h.verificationMode || "Manual"} onChange={e => updateHabit(h.id, { verificationMode: e.target.value })} className="p-2 border rounded bg-white text-sm">
                        <option value="Manual">Manual</option>
                        <option value="Location">📍 Location</option>
                        <option value="Photo">📷 Photo AI</option>
                        <option value="Health">❤️ Health API</option>
                        <option value="Peer">👥 Peer Approval</option>
                      </select>
                      {h.verificationMode === 'Location' && (
                        <button onClick={() => {
                          if (!navigator.geolocation) return addToast("Geolocation not supported", "error");
                          navigator.geolocation.getCurrentPosition(
                            pos => { updateHabit(h.id, { locationData: { lat: pos.coords.latitude, lng: pos.coords.longitude, radiusMeters: 200 } }); addToast(`📍 Location saved for "${h.name}"`, "success"); },
                            () => addToast("GPS access denied", "error")
                          );
                        }} className="px-3 py-1 bg-teal/10 text-teal rounded text-sm font-bold hover:bg-teal/20">
                          {h.locationData ? "✅ Set" : "Set 📍"}
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              <div className="border-t pt-4 flex gap-3 flex-wrap">
                <button onClick={exportData} className="px-4 py-2 bg-gray-800 text-white rounded font-bold hover:bg-gray-900">📤 Export Data</button>
                <button onClick={resetData} className="px-4 py-2 bg-accentRed text-white rounded font-bold hover:opacity-90">🗑️ Reset All Data</button>
              </div>
            </div>
          </div>
        );
      }

      // ─── DailyTracker ─────────────────────────────────────────────────────────────
      function DailyTracker({ currentMonth, globalHabits, data, forceToggleDay, updateHabit, addHabit, deleteHabit, hideControls, appConfig, setPendingApprovals, pendingApprovals, addToast, teamModeMemberId }) {
        const [yStr, mStr] = currentMonth.split('-');
        const y = parseInt(yStr), m = parseInt(mStr) - 1;
        const WEEKS = useMemo(() => getWeekGroupings(y, m), [y, m]);
        const totalCompleted = useMemo(() => globalHabits.reduce((acc, h) => acc + Object.values(data[h.id]||{}).filter(Boolean).length, 0), [data, globalHabits]);
        const totalGoals = globalHabits.reduce((acc, h) => acc + h.goal, 0);
        const overallProgress = totalGoals > 0 ? ((totalCompleted / totalGoals) * 100).toFixed(1) : 0;

        const [photoModal, setPhotoModal] = useState(null);
        const [xpAnims, setXpAnims] = useState([]);

        const trigXp = (amt, e) => {
          if (!e || amt <= 0) return;
          const r = e.currentTarget ? e.currentTarget.getBoundingClientRect() : e.target.getBoundingClientRect();
          const animId = Date.now();
          setXpAnims(prev => [...prev, { id: animId, amt, x: r.left + r.width/2, y: r.top - 10 }]);
          setTimeout(() => setXpAnims(prev => prev.filter(a => a.id !== animId)), 1100);
        };

        const handleToggle = (e, h, d) => {
          if (hideControls) return;
          const isCurrentlyChecked = !!(data[h.id]?.[d]);
          if (isCurrentlyChecked) { forceToggleDay(h.id, d); return; }

          const mode = h.verificationMode || "Manual";
          if (mode === 'Location') {
            if (!h.locationData) return addToast("Set location in Settings first 📍", "warning");
            addToast("Checking GPS location...", "info");
            navigator.geolocation.getCurrentPosition(
              pos => {
                const dist = haversine(pos.coords.latitude, pos.coords.longitude, h.locationData.lat, h.locationData.lng);
                if (dist <= h.locationData.radiusMeters) { const g = forceToggleDay(h.id, d); addToast("✅ Location verified! Habit logged.", "success"); trigXp(g, e); }
                else addToast(`❌ You're ${Math.round(dist)}m away. Get to your location!`, "error");
              },
              () => addToast("⚠️ GPS access denied. Enable location.", "error")
            );
            return;
          }
          if (mode === 'Photo') {
            setPhotoModal({ hId: h.id, dN: d, name: h.name, file: null, preview: null, loading: false, ev: e });
            return;
          }
          if (mode === 'Peer') {
            const reqs = JSON.parse(localStorage.getItem('pendingApprovals_v1')||'[]');
            const mems = JSON.parse(localStorage.getItem('teamMembers_v1')||'[]');
            reqs.push({ id:`req_${Date.now()}`, requesterId: teamModeMemberId || 'myself', requesterName: "Me", habitId: h.id, habitName: h.name, dayNum: d, month: currentMonth, timestamp: Date.now(), votes: {}, requiredVotes: Math.max(1, Math.ceil(mems.length / 2)) });
            localStorage.setItem('pendingApprovals_v1', JSON.stringify(reqs));
            setPendingApprovals(reqs);
            addToast("⏳ Approval request sent to team!", "info");
            return;
          }
          const g = forceToggleDay(h.id, d);
          trigXp(g, e);
        };

        const submitPhoto = async () => {
          if (!photoModal || !photoModal.file) return addToast("Please select a photo first", "warning");
          setPhotoModal(p => ({...p, loading: true}));
          try {
            const result = await analyzeFoodPhoto(photoModal.file, appConfig ? appConfig.anthropicApiKey : "");
            if (result.isHealthy && result.confidence >= 70) {
              const g = forceToggleDay(photoModal.hId, photoModal.dN);
              addToast(`✅ ${result.foodName} verified! Healthy choice! +10 XP`, "success");
              trigXp(g, photoModal.ev);
              setPhotoModal(null);
            } else if (!result.foodDetected) {
              setPhotoModal(p => ({...p, loading: false}));
              addToast("⚠️ No food detected. Take a clear photo of your meal.", "warning");
            } else {
              setPhotoModal(p => ({...p, loading: false}));
              addToast(`❌ Looks like ${result.foodName}. Eat healthy to unlock this! (${result.reason})`, "error");
            }
          } catch (err) {
            setPhotoModal(p => ({...p, loading: false}));
            addToast("❌ " + (typeof err === 'string' ? err : err.message || "Error"), "error");
          }
        };

        const isPending = (hId, dN) => pendingApprovals && pendingApprovals.find(r => r.requesterId === (teamModeMemberId || 'myself') && r.habitId === hId && r.dayNum === dN && r.month === currentMonth);

        return (
          <div className="bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col mt-4 relative">
            {xpAnims.map(a => (
              <div key={a.id} className="float-xp" style={{ left: a.x, top: a.y }}>+{a.amt} XP ✨</div>
            ))}

            {photoModal && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[200] p-4">
                <div className="bg-white rounded-2xl p-6 shadow-2xl w-full max-w-sm">
                  <h3 className="text-lg font-black mb-1">Prove It 📸</h3>
                  <p className="text-sm text-gray-500 mb-4">{photoModal.name}</p>
                  <input type="file" accept="image/*" capture="environment" onChange={e => {
                    const f = e.target.files[0];
                    if (f) {
                      const reader = new FileReader();
                      reader.onload = () => setPhotoModal(p => ({...p, file: f, preview: reader.result}));
                      reader.readAsDataURL(f);
                    }
                  }} className="w-full mb-4 text-sm" />
                  {photoModal.preview && <img src={photoModal.preview} alt="preview" className="w-full h-44 object-cover rounded-lg mb-4 border" />}
                  <div className="flex justify-end gap-2">
                    <button onClick={() => setPhotoModal(null)} className="px-4 py-2 font-bold text-gray-500 hover:text-gray-800">Cancel</button>
                    <button onClick={submitPhoto} disabled={photoModal.loading} className="px-4 py-2 bg-teal text-white rounded-lg font-bold shadow hover:bg-teal-light disabled:opacity-60">
                      {photoModal.loading ? "Analysing... 🤖" : "Analyse with AI 🤖"}
                    </button>
                  </div>
                </div>
              </div>
            )}

            <div className="p-4 bg-teal text-white flex justify-between items-center rounded-t-xl">
              <h2 className="text-xl font-bold">{hideControls ? "Member Tracker" : "Daily Habit Tracker"}</h2>
              <div className="flex items-center gap-4">
                <div className="text-right">
                  <div className="text-sm opacity-80 uppercase tracking-wider">Overall</div>
                  <div className="text-2xl font-bold">{overallProgress}%</div>
                </div>
                <div className="w-32 h-4 bg-black/20 rounded-full border border-white/20 overflow-hidden">
                  <div className="h-full bg-accentRed transition-all" style={{ width: `${Math.min(100, overallProgress)}%` }}></div>
                </div>
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-sm text-center border-collapse">
                <thead>
                  <tr className="bg-gray-50 text-xs uppercase text-gray-500">
                    <th className="p-3 text-left w-56 sticky left-0 z-10 bg-gray-50 border-r-2 border-gray-200">Habits</th>
                    {WEEKS.map((w, i) => <th key={w.label} colSpan={w.days.length} className={`p-2 border-r-2 border-gray-300 ${i%2===0?'bg-teal/5':'bg-gray-100'}`}>{w.label}</th>)}
                    <th className="p-2 border-l-2 bg-gray-50 w-16">Goal</th>
                    <th className="p-2 w-16 text-teal">Com</th>
                    <th className="p-2 w-32">Progress</th>
                    {!hideControls && <th className="p-2 w-10"></th>}
                  </tr>
                  <tr className="bg-white text-xs font-semibold border-b-2 border-gray-200">
                    <th className="p-2 sticky left-0 z-10 bg-white border-r-2 border-gray-200"></th>
                    {WEEKS.map((w, i) => w.days.map((day, di) => (
                      <th key={day} className={`p-1 min-w-[28px] border-b ${di===w.days.length-1?'border-r-2 border-gray-300':'border-r border-gray-100'} ${i%2===0?'bg-teal/5':'bg-gray-50'}`}>
                        <div className="flex flex-col items-center">
                          <span className="text-[9px] text-gray-400 font-normal uppercase">{getDayOfWeek(y, m, day)}</span>
                          <span>{day}</span>
                        </div>
                      </th>
                    )))}
                    <td colSpan={hideControls ? 3 : 4} className="bg-gray-50"></td>
                  </tr>
                </thead>
                <tbody>
                  {globalHabits.map(habit => {
                    const com = Object.values(data[habit.id]||{}).filter(Boolean).length;
                    const prog = habit.goal > 0 ? Math.min(100, (com / habit.goal) * 100) : 0;
                    const vMode = habit.verificationMode || "Manual";
                    const modeIcon = vMode==='Location'?'📍':vMode==='Photo'?'📷':vMode==='Peer'?'👥':vMode==='Health'?'❤️':'';
                    return (
                      <tr key={habit.id} className="hover:bg-gray-50/50 group">
                        <td className="p-2 text-left sticky left-0 z-10 bg-white border-r-2 border-gray-200 group-hover:bg-gray-50">
                          <div className="flex items-center gap-1">
                            {modeIcon && <span className="text-xs">{modeIcon}</span>}
                            {!hideControls
                              ? <input type="text" value={habit.name} onChange={e => updateHabit(habit.id, { name: e.target.value })} className="w-full bg-transparent outline-none font-medium text-gray-700 text-sm" />
                              : <div className="font-medium text-gray-700 truncate text-sm">{habit.name}</div>
                            }
                          </div>
                        </td>
                        {WEEKS.map((w, wi) => w.days.map((day, di) => {
                          const isC = !!(data[habit.id]?.[day]);
                          const pending = isPending(habit.id, day);
                          return (
                            <td key={day} onClick={e => handleToggle(e, habit, day)}
                              className={`p-0 cursor-pointer transition-colors border-r ${di===w.days.length-1?'border-r-2 border-gray-300':'border-gray-100'} ${wi%2===0?'bg-teal/5':''} ${pending?'bg-amber-100':'hover:bg-gray-200'}`}>
                              <div className={`w-full h-8 flex items-center justify-center ${isC?'bg-teal text-white':pending?'text-amber-500 pulse-glow':'text-transparent'}`}>
                                {isC ? <CheckIcon /> : pending ? '⏳' : ''}
                              </div>
                            </td>
                          );
                        }))}
                        <td className="p-1 border-l-2 bg-gray-50">
                          {!hideControls
                            ? <input type="number" value={habit.goal} onChange={e => updateHabit(habit.id, { goal: parseInt(e.target.value)||1 })} className="w-full text-center bg-transparent outline-none font-bold text-gray-800" min="1" max="31" />
                            : <div className="text-center font-bold">{habit.goal}</div>
                          }
                        </td>
                        <td className="p-2 font-bold text-teal">{com}</td>
                        <td className="p-2 border-l border-gray-200">
                          <div className="flex items-center gap-1">
                            <span className="text-xs font-semibold w-8 text-right">{prog.toFixed(0)}%</span>
                            <div className="flex-1 h-3 bg-gray-200 rounded-full overflow-hidden shadow-inner">
                              <div className="h-full transition-all" style={{ width: `${prog}%`, backgroundColor: getProgressColor(prog) }}></div>
                            </div>
                          </div>
                        </td>
                        {!hideControls && (
                          <td className="p-2 text-center">
                            <button onClick={() => deleteHabit(habit.id)} className="text-gray-400 hover:text-accentRed"><TrashIcon /></button>
                          </td>
                        )}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            {!hideControls && (
              <div className="p-4 bg-gray-50 border-t flex justify-between items-center">
                <button onClick={addHabit} className="flex items-center gap-2 px-4 py-2 bg-teal text-white rounded shadow font-medium text-sm hover:bg-teal-light">
                  <PlusIcon /> Add New Habit
                </button>
                <div className="flex items-center gap-3 text-xs text-gray-500">
                  <span className="flex items-center gap-1"><span className="w-3 h-3 bg-teal rounded-sm inline-block"></span> Done</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 bg-gray-200 border rounded-sm inline-block"></span> Pending</span>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ─── OverviewDashboard ───────────────────────────────────────────────────────
      function OverviewDashboard({ currentMonth, data, globalHabits }) {
        if (!window.Recharts) return <div className="p-8 text-center text-accentRed font-bold">Recharts failed to load. Check your connection.</div>;
        const [yStr, mStr] = currentMonth.split('-');
        const y = parseInt(yStr), m = parseInt(mStr) - 1;
        const days = getDaysInMonth(y, m);
        const dailyData = useMemo(() => {
          const res = [];
          for (let d = 1; d <= days; d++) {
            let com = 0; globalHabits.forEach(h => { if(data[h.id]?.[d]) com++; });
            res.push({ day: `D${d}`, percent: globalHabits.length > 0 ? parseFloat(((com/globalHabits.length)*100).toFixed(1)) : 0 });
          }
          return res;
        }, [data, globalHabits, days]);
        const pieData = useMemo(() => {
          let com = 0; globalHabits.forEach(h => com += Object.values(data[h.id]||{}).filter(Boolean).length);
          const total = globalHabits.reduce((acc, h) => acc + h.goal, 0);
          return [{ name: 'Completed', value: com }, { name: 'Left', value: Math.max(0, total - com) }];
        }, [data, globalHabits]);
        return (
          <div className="space-y-6 mt-4">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 bg-white p-6 rounded-xl shadow border border-gray-200">
                <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center justify-between">
                  Daily Trend <span className="text-xs bg-teal/10 text-teal px-2 py-1 rounded">{monthNames[m]} {y}</span>
                </h3>
                <div className="h-72"><ResponsiveContainer width="100%" height="100%">
                  <AreaChart data={dailyData} margin={{ top:10,right:10,left:-20,bottom:0 }}>
                    <defs><linearGradient id="cPct" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#2a7d7b" stopOpacity={0.8}/><stop offset="95%" stopColor="#2a7d7b" stopOpacity={0}/></linearGradient></defs>
                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e5e7eb" />
                    <XAxis dataKey="day" tick={{fontSize:12,fill:'#6b7280'}} tickLine={false} axisLine={false} tickMargin={10} minTickGap={20}/>
                    <YAxis tick={{fontSize:12,fill:'#6b7280'}} tickLine={false} axisLine={false} domain={[0,100]} />
                    <Tooltip contentStyle={{borderRadius:'8px',border:'none',boxShadow:'0 4px 12px rgba(0,0,0,.1)'}} formatter={v=>[`${v}%`,'Completion']} />
                    <Area type="monotone" dataKey="percent" stroke="#2a7d7b" strokeWidth={3} fillOpacity={1} fill="url(#cPct)" />
                  </AreaChart>
                </ResponsiveContainer></div>
              </div>
              <div className="bg-white p-6 rounded-xl shadow border border-gray-200 flex flex-col items-center">
                <h3 className="text-lg font-bold text-gray-800 mb-2 w-full border-b pb-2">Hit / Miss Ratio</h3>
                <div className="flex-1 w-full relative flex items-center justify-center min-h-[250px]">
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie data={pieData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value" stroke="none">
                        {pieData.map((e, i) => <Cell key={i} fill={['#2a7d7b','#e8a09a'][i%2]} />)}
                      </Pie>
                      <Tooltip formatter={(v,n) => [v, n]} contentStyle={{borderRadius:'8px',border:'none'}}/>
                    </PieChart>
                  </ResponsiveContainer>
                  <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                    <span className="text-3xl font-black text-gray-800">{pieData[0].value+pieData[1].value>0?Math.round((pieData[0].value/(pieData[0].value+pieData[1].value))*100):0}%</span>
                    <span className="text-xs text-gray-500 font-medium uppercase tracking-wider">Done</span>
                  </div>
                </div>
                <div className="flex justify-center gap-4 mt-2">
                  <div className="flex items-center gap-1 text-sm"><div className="w-3 h-3 rounded-full bg-teal"></div> Completed ({pieData[0].value})</div>
                  <div className="flex items-center gap-1 text-sm"><div className="w-3 h-3 rounded-full bg-salmon"></div> Left ({pieData[1].value})</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ─── TeamDashboard ───────────────────────────────────────────────────────────
      function TeamDashboard({ currentMonth, globalHabits, teamMembers, allTeamData, toggleTeamDay, addTeamMember, removeTeamMember, xpData, pendingApprovals, setPendingApprovals, prevRanks, setPrevRanks, forceToggleDay, addToast, nudges, setNudges }) {
        const [newMember, setNewMember] = useState("");
        const [expandedId, setExpandedId] = useState(null);
        const [yStr, mStr] = currentMonth.split('-');
        const days = getDaysInMonth(parseInt(yStr), parseInt(mStr)-1);
        const TRASH_TALKS = ["Stop slacking! 😤","Wake up and grind! 🏃","I'm crushing you! 👑","Is that all you got? 🥱","Time to focus! 🎯"];

        const stats = useMemo(() => teamMembers.map(member => {
          let com = 0;
          const tD = allTeamData[member.id] || {};
          const tGoals = globalHabits.reduce((acc, h) => acc + h.goal, 0);
          globalHabits.forEach(h => { if(tD[h.id]) com += Object.values(tD[h.id]).filter(Boolean).length; });
          return { ...member, com, per: tGoals > 0 ? (com/tGoals)*100 : 0 };
        }).sort((a,b) => b.per - a.per), [teamMembers, allTeamData, globalHabits]);

        const teamStreak = useMemo(() => {
          if (teamMembers.length === 0) return { current: 0, best: 0 };
          let cSt = 0, mSt = 0;
          for (let d = 1; d <= days; d++) {
            const allDid = teamMembers.every(member => {
              const mdata = allTeamData[member.id] || {};
              return globalHabits.some(h => mdata[h.id]?.[d]);
            });
            if (allDid) { cSt++; mSt = Math.max(mSt, cSt); } else { cSt = 0; }
          }
          const savedB = parseInt(localStorage.getItem('bestTeamStreak_v1')||'0');
          if (mSt > savedB) localStorage.setItem('bestTeamStreak_v1', String(mSt));
          return { current: cSt, best: Math.max(mSt, savedB) };
        }, [teamMembers, allTeamData, globalHabits, days]);

        const handleVote = (req, approve) => {
          const reqs = pendingApprovals.map(r => r.id === req.id ? {...r, votes: {...r.votes, myself: approve}} : r);
          const updReq = reqs.find(r => r.id === req.id);
          if (!updReq) return;
          const yV = Object.values(updReq.votes).filter(v=>v===true).length;
          const nV = Object.values(updReq.votes).filter(v=>v===false).length;
          if (yV >= updReq.requiredVotes) {
            setPendingApprovals(reqs.filter(r => r.id !== req.id));
            forceToggleDay(updReq.habitId, updReq.dayNum);
            addToast(`✅ "${updReq.habitName}" approved! +10 XP 🎉`, "success");
          } else if (nV >= updReq.requiredVotes) {
            setPendingApprovals(reqs.filter(r => r.id !== req.id));
            addToast(`❌ "${updReq.habitName}" rejected by team.`, "error");
          } else {
            setPendingApprovals(reqs);
            addToast("Vote recorded!", "info");
          }
        };

        const sendNudge = (memberId, memberName) => {
          const ns = JSON.parse(localStorage.getItem('nudges_v1')||'[]');
          ns.push({ id: `n_${Date.now()}`, targetId: memberId, message: TRASH_TALKS[Math.floor(Math.random()*TRASH_TALKS.length)], timestamp: Date.now(), read: false });
          localStorage.setItem('nudges_v1', JSON.stringify(ns));
          addToast(`💬 Trash talk sent to ${memberName}!`, "success");
        };

        const myNudges = (nudges || []).filter(n => !n.read && n.targetId === 'myself');
        const dismissNudge = id => {
          const ns = (nudges || []).map(n => n.id===id ? {...n, read:true} : n);
          setNudges(ns);
        };

        return (
          <div className="space-y-6 mt-4">
            {myNudges.map(n => (
              <div key={n.id} className="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-lg shadow flex justify-between items-center">
                <div className="font-bold text-amber-800">💬 "{n.message}"</div>
                <button onClick={() => dismissNudge(n.id)} className="text-amber-600 font-bold hover:underline text-sm">Dismiss</button>
              </div>
            ))}

            {pendingApprovals.length > 0 && (
              <div className="bg-blue-50 border border-blue-200 rounded-xl p-6">
                <h3 className="text-lg font-bold text-blue-900 mb-4 flex items-center gap-2">
                  ⚡ Pending Approvals
                  <span className="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">{pendingApprovals.length}</span>
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {pendingApprovals.map(req => (
                    <div key={req.id} className="bg-white p-4 rounded-lg border border-blue-100 shadow-sm">
                      <p className="text-sm font-medium text-gray-800 mb-3">
                        <span className="font-bold">{req.requesterName}</span> wants to log <span className="font-bold text-teal">{req.habitName}</span> for Day {req.dayNum}
                      </p>
                      <div className="flex gap-2">
                        <button onClick={() => handleVote(req, true)} className="flex-1 py-1.5 bg-green-100 text-green-800 hover:bg-green-200 rounded font-bold text-sm">✅ Approve</button>
                        <button onClick={() => handleVote(req, false)} className="flex-1 py-1.5 bg-red-100 text-red-800 hover:bg-red-200 rounded font-bold text-sm">❌ Reject</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="bg-white p-6 rounded-xl shadow border border-gray-200">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <h3 className="text-2xl font-black text-gray-800">Team Leaderboard 🏆</h3>
                <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 shadow-sm">
                  <div className="text-xs font-bold text-amber-700 uppercase">Weekly Challenge 🎯</div>
                  <div className="text-sm font-bold text-gray-800">Complete 5 habits for 5 days → <span className="text-teal">+500 XP</span></div>
                  <div className="w-full h-1.5 bg-amber-200 rounded-full mt-1 overflow-hidden"><div className="h-full bg-amber-500 w-[40%]"></div></div>
                </div>
              </div>

              {stats.length >= 3 && (
                <div className="flex justify-center items-end gap-4 mb-8 h-36">
                  <div className="relative w-1/4 max-w-[110px] bg-gradient-to-t from-gray-300 to-gray-100 rounded-t-xl h-[55%] flex flex-col items-center justify-start pt-3 shadow">
                    <div className="absolute -top-9 text-3xl">🥈</div>
                    <div className="font-bold text-gray-700 truncate w-full text-center px-1 text-sm">{stats[1] ? stats[1].name : ''}</div>
                    <div className="text-sm font-black text-teal">{stats[1] ? stats[1].per.toFixed(0) : 0}%</div>
                  </div>
                  <div className="relative w-1/3 max-w-[140px] bg-gradient-to-t from-yellow-300 to-yellow-100 rounded-t-xl h-[100%] flex flex-col items-center justify-start pt-3 shadow-xl z-10 border-t-4 border-yellow-400">
                    <div className="absolute -top-10 text-4xl">🥇</div>
                    <div className="font-black text-gray-800 truncate w-full text-center px-1">{stats[0] ? stats[0].name : ''}</div>
                    <div className="font-black text-teal text-xl">{stats[0] ? stats[0].per.toFixed(0) : 0}%</div>
                  </div>
                  <div className="relative w-1/4 max-w-[110px] bg-gradient-to-t from-orange-300 to-orange-100 rounded-t-xl h-[45%] flex flex-col items-center justify-start pt-3 shadow">
                    <div className="absolute -top-9 text-3xl">🥉</div>
                    <div className="font-bold text-gray-700 truncate w-full text-center px-1 text-sm">{stats[2] ? stats[2].name : ''}</div>
                    <div className="text-sm font-black text-teal">{stats[2] ? stats[2].per.toFixed(0) : 0}%</div>
                  </div>
                </div>
              )}

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {stats.map((member, i) => {
                  const rCh = prevRanks[member.id] ? prevRanks[member.id] - (i+1) : 0;
                  return (
                    <div key={member.id} className="p-4 bg-gray-50 rounded-xl border border-gray-200 shadow-sm">
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-full bg-teal text-white flex items-center justify-center font-black text-lg shadow">{member.name.charAt(0).toUpperCase()}</div>
                          <div>
                            <div className="font-bold text-gray-800 flex items-center gap-2">
                              {member.name}
                              {rCh > 0 ? <span className="text-xs text-green-500 font-bold">▲{rCh}</span> : rCh < 0 ? <span className="text-xs text-red-500 font-bold">▼{Math.abs(rCh)}</span> : null}
                            </div>
                            <div className="text-xs text-gray-400 font-bold uppercase">Rank {i+1}</div>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="font-black text-teal text-2xl">{member.per.toFixed(1)}%</div>
                          <div className="text-[10px] text-gray-400 font-bold uppercase">Completed</div>
                        </div>
                      </div>
                      <LevelDisplay xpData={xpData[member.id]} />
                      <div className="flex gap-2 mt-3">
                        <button onClick={() => setExpandedId(expandedId === member.id ? null : member.id)} className="flex-1 px-3 py-1.5 bg-gray-200 hover:bg-gray-300 rounded text-sm font-bold text-gray-700">
                          {expandedId === member.id ? 'Hide Grid' : 'View Grid'}
                        </button>
                        <button onClick={() => sendNudge(member.id, member.name)} className="px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 rounded text-sm font-bold">💬 Nudge</button>
                        <button onClick={() => removeTeamMember(member.id)} className="px-2 py-1.5 text-gray-400 hover:text-accentRed"><TrashIcon /></button>
                      </div>
                    </div>
                  );
                })}

                <div className="p-4 bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 flex flex-col justify-center items-center gap-3">
                  <h4 className="font-bold text-sm text-gray-500 uppercase">Add Teammate</h4>
                  <div className="flex gap-2 w-full max-w-[260px]">
                    <input value={newMember} onChange={e => setNewMember(e.target.value)} onKeyDown={e => { if(e.key==='Enter' && newMember.trim() && teamMembers.length < 8) { addTeamMember(newMember.trim()); setNewMember(''); } }} placeholder="Name..." className="flex-1 px-3 py-2 rounded border border-gray-300 text-sm focus:outline-none focus:ring-1 focus:ring-teal" />
                    <button onClick={() => { if(newMember.trim() && teamMembers.length < 8) { addTeamMember(newMember.trim()); setNewMember(''); } }} className="px-4 py-2 bg-teal text-white rounded hover:bg-teal-light font-bold text-sm">Add</button>
                  </div>
                  {teamMembers.length >= 8 && <p className="text-xs text-gray-500">Max 8 members reached</p>}
                </div>
              </div>
            </div>

            <div className="bg-gradient-to-r from-teal to-teal-light text-white p-6 rounded-xl shadow-lg flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="text-5xl">🔥</div>
                <div>
                  <div className="text-sm font-bold opacity-80 uppercase tracking-widest">Team Streak</div>
                  <div className="text-3xl font-black">{teamStreak.current} Days</div>
                  <div className="text-xs opacity-75 mt-1">Best Ever: {teamStreak.best} Days</div>
                </div>
              </div>
              <div className="hidden sm:block text-right text-sm font-medium opacity-90 max-w-[200px]">
                A team streak grows when ALL members complete at least one habit each day!
              </div>
            </div>

            {expandedId && (() => {
              const memberName = stats.find(m => m.id === expandedId)?.name || '';
              return (
                <div className="border-t-2 border-teal pt-4">
                  <h3 className="text-xl font-black text-gray-800 mb-2">{memberName}'s Grid</h3>
                  <DailyTracker
                    currentMonth={currentMonth} globalHabits={globalHabits}
                    data={allTeamData[expandedId] || {}}
                    forceToggleDay={(hId, dN) => toggleTeamDay(expandedId, hId, dN)}
                    addToast={addToast} hideControls={true}
                    pendingApprovals={pendingApprovals} teamModeMemberId={expandedId}
                    appConfig={{}} setPendingApprovals={setPendingApprovals}
                  />
                </div>
              );
            })()}
          </div>
        );
      }

      // ─── App ──────────────────────────────────────────────────────────────────────
      function App() {
        const store = useAppStore();
        const { currentMonth, setCurrentMonth, globalHabits, monthlyData, forceToggleDay, updateHabit, addHabit, deleteHabit, teamMembers, teamMonthlyData, toggleTeamDay, addTeamMember, removeTeamMember, xpData, appConfig, setAppConfig, pendingApprovals, setPendingApprovals, nudges, setNudges, prevRanks, setPrevRanks } = store;

        const [activeTab, setActiveTab] = useState('daily');
        const [toasts, setToasts] = useState([]);
        const addToast = useCallback((msg, type='info') => {
          const id = Date.now() + Math.random();
          setToasts(p => [...p, { id, msg, type }]);
          setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 4000);
        }, []);

        const [yStr, mStr] = currentMonth.split('-');
        const curMName = monthNames[parseInt(mStr) - 1];
        const shiftMonth = d => {
          let nM = parseInt(mStr) + d, nY = parseInt(yStr);
          if (nM < 1) { nM = 12; nY--; } else if (nM > 12) { nM = 1; nY++; }
          setCurrentMonth(`${nY}-${String(nM).padStart(2,'0')}`);
        };

        const pendingCount = pendingApprovals.filter(p => p.requesterId !== 'myself').length;
        const tabs = [
          { id: 'daily', label: 'Daily Habits' },
          { id: 'overview', label: 'Overview' },
          { id: 'team', label: 'Team Hub', badge: pendingCount },
          { id: 'settings', label: '⚙️ Settings' },
        ];

        return (
          <div className="min-h-screen flex flex-col bg-lightBg text-gray-800">
            <div className="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 max-w-sm">
              {toasts.map(t => (
                <div key={t.id} className={`toast-enter px-5 py-3 rounded-xl shadow-2xl font-bold text-white flex items-center gap-3 ${t.type==='success'?'bg-green-600':t.type==='error'?'bg-red-600':t.type==='warning'?'bg-amber-500':'bg-blue-600'}`}>
                  <span>{t.type==='success'?'✅':t.type==='error'?'❌':t.type==='warning'?'⚠️':'ℹ️'}</span>
                  <span className="text-sm leading-snug">{t.msg}</span>
                </div>
              ))}
            </div>

            <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
              <div className="max-w-[1600px] mx-auto px-4 md:px-6 h-[72px] flex items-center justify-between gap-4">
                <div className="flex items-center gap-3 flex-shrink-0">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-teal to-teal-light flex items-center justify-center shadow-md">
                    <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7"/></svg>
                  </div>
                  <h1 className="text-xl font-black tracking-tight text-gray-800">
                    Habit<span className="text-teal">Flow</span>
                    <span className="bg-yellow-100 text-yellow-800 text-[10px] uppercase font-bold px-1.5 py-0.5 rounded ml-1 border border-yellow-200 align-top">Pro</span>
                  </h1>
                </div>

                <div className="flex bg-gray-100 p-1 rounded-lg shadow-inner">
                  {tabs.map(tab => (
                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`relative px-3 py-1.5 text-sm font-bold rounded-md transition-all ${activeTab===tab.id?'bg-white text-teal shadow-sm ring-1 ring-gray-200':'text-gray-500 hover:text-gray-700'}`}>
                      {tab.label}
                      {tab.badge > 0 && <span className="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white rounded-full text-[9px] font-bold flex items-center justify-center ring-2 ring-white">{tab.badge}</span>}
                    </button>
                  ))}
                </div>

                <div className="flex items-center gap-3 flex-shrink-0">
                  <LevelDisplay xpData={xpData['myself']} />
                  <div className="flex items-center bg-gray-100 rounded-lg border border-gray-200 px-1 shadow-inner">
                    <button onClick={() => shiftMonth(-1)} className="p-1.5 text-gray-500 hover:bg-white hover:text-gray-800 rounded transition"><ChevronLeftIcon /></button>
                    <div className="font-black text-gray-700 min-w-[130px] text-center text-sm">{curMName} {yStr}</div>
                    <button onClick={() => shiftMonth(1)} className="p-1.5 text-gray-500 hover:bg-white hover:text-gray-800 rounded transition"><ChevronRightIcon /></button>
                  </div>
                </div>
              </div>
            </header>

            <main className="flex-1 w-full max-w-[1600px] mx-auto p-4 md:p-6 pb-20 overflow-x-hidden">
              {activeTab === 'daily' && (
                <DailyTracker currentMonth={currentMonth} globalHabits={globalHabits} data={monthlyData} forceToggleDay={forceToggleDay} updateHabit={updateHabit} addHabit={addHabit} deleteHabit={deleteHabit} appConfig={appConfig} setPendingApprovals={setPendingApprovals} pendingApprovals={pendingApprovals} addToast={addToast} />
              )}
              {activeTab === 'overview' && (
                <OverviewDashboard currentMonth={currentMonth} globalHabits={globalHabits} data={monthlyData} />
              )}
              {activeTab === 'team' && (
                <TeamDashboard currentMonth={currentMonth} globalHabits={globalHabits} teamMembers={teamMembers} allTeamData={teamMonthlyData} toggleTeamDay={toggleTeamDay} addTeamMember={addTeamMember} removeTeamMember={removeTeamMember} xpData={xpData} pendingApprovals={pendingApprovals} setPendingApprovals={setPendingApprovals} prevRanks={prevRanks} setPrevRanks={setPrevRanks} forceToggleDay={forceToggleDay} addToast={addToast} nudges={nudges} setNudges={setNudges} />
              )}
              {activeTab === 'settings' && (
                <SettingsTab appConfig={appConfig} setAppConfig={setAppConfig} globalHabits={globalHabits} updateHabit={updateHabit} addToast={addToast} forceToggleDay={forceToggleDay} />
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
