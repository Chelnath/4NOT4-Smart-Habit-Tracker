<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Habit Tracker</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              teal: { DEFAULT: '#2a7d7b', light: '#3a9593' },
              salmon: { DEFAULT: '#e8a09a', dark: '#d58c86' },
              accentRed: '#c0392b',
              lightBg: '#f8f9fa'
            }
          }
        }
      }
    </script>
    
    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts (CDN) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>

    <style>
      body {
        background-color: #f8f9fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      th, td { border: 1px solid #e5e7eb; }
      th { font-weight: 600; color: #374151; }
      /* Remove arrows from number input */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none; margin: 0; 
      }
    </style>
</head>
<body>
    <div id="error-log" style="color: red; padding: 20px; font-weight: bold; font-family: monospace; white-space: pre-wrap;"></div>
    <script>
      window.addEventListener('error', function(e) { document.getElementById('error-log').innerText += '\n[JS Error]: ' + e.message; });
      window.addEventListener('unhandledrejection', function(e) { document.getElementById('error-log').innerText += '\n[Promise Error]: ' + e.reason; });
    </script>

    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useCallback } = React;
      
      const RechartsLib = window.Recharts || {};
      const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = RechartsLib;

      if (!window.Recharts) {
        document.getElementById('error-log').innerText += '\n[Warning]: Recharts library failed to load from CDN. Check your internet connection.';
      }

      // --- Icons ---
      const CheckIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      );
      const TrashIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      );
      const PlusIcon = () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      );

      // --- Data & Helpers ---
      const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const SHORT_DAYS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      
      const defaultHabitNames = [
        "Wake Up (4AM)", "Shilajit", "500ml Water", "CAT 2 Prep", "Bath", 
        "3 Egg Morning", "Proper Lunch Meal", "Pre Workout", "Gym", 
        "Post Workout Shake", "Assignments/Pendings", "MBA Prep", 
        "PCB Design", "Read Book/Newspaper", "Protein Dinner", "Sleep 6Hrs"
      ];

      const INITIAL_HABITS = defaultHabitNames.map((name, index) => ({
        id: `h_init_${index}`, name, goal: 10, days: {}
      }));

      function getDaysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
      }

      function generateWeeks(year, month) {
        const daysInMonth = getDaysInMonth(year, month);
        const weeks = [];
        let currentWeek = { label: "Week 1", days: [] };
        
        for (let day = 1; day <= daysInMonth; day++) {
          const dayOfWeek = new Date(year, month, day).getDay(); // 0=Sun, 6=Sat
          currentWeek.days.push(day);
          
          if (dayOfWeek === 6 || day === daysInMonth) {
            weeks.push(currentWeek);
            currentWeek = { label: `Week ${weeks.length + 1}`, days: [] };
          }
        }
        return weeks;
      }

      function generateSimpleWeeks(daysInMonth) {
        const weeks = [];
        weeks.push({ label: "Week 1", days: [1,2,3,4,5,6,7] });
        weeks.push({ label: "Week 2", days: [8,9,10,11,12,13,14] });
        weeks.push({ label: "Week 3", days: [15,16,17,18,19,20,21] });
        weeks.push({ label: "Week 4", days: [22,23,24,25,26,27,28] });
        if (daysInMonth > 28) {
          const w5Days = [];
          for (let d = 29; d <= daysInMonth; d++) w5Days.push(d);
          weeks.push({ label: "Week 5", days: w5Days });
        }
        return weeks;
      }

      function calculateHabitStats(habit) {
        const completed = Object.values(habit.days).filter(Boolean).length;
        const left = Math.max(0, habit.goal - completed);
        const progress = habit.goal > 0 ? Math.min(100, (completed / habit.goal) * 100) : 0;
        return { completed, left, progress };
      }

      function getProgressBarColor(percent) {
        if (percent < 33) return '#c0392b'; 
        if (percent < 66) return '#e8a09a'; 
        return '#2a7d7b'; 
      }

      // --- State Hook ---
      function useHabitData(year, month) {
        const monthKey = `${year}-${String(month).padStart(2, '0')}`;

        const [allData, setAllData] = useState(() => {
          const saved = localStorage.getItem('habitTrackerData_v2');
          if (saved) {
            try { return JSON.parse(saved); } catch (e) { console.error(e); }
          }
          return { '2026-02': INITIAL_HABITS }; // Default seeded with March 2026 (month 2)
        });

        // Auto-save to localStorage
        useEffect(() => {
          localStorage.setItem('habitTrackerData_v2', JSON.stringify(allData));
        }, [allData]);

        // Derive active month's data, copying habits from the chronologically latest month if missing
        const currentData = useMemo(() => {
          if (allData[monthKey]) return allData[monthKey];
          
          const keys = Object.keys(allData).sort().reverse();
          if (keys.length > 0) {
            const previousHabits = allData[keys[0]];
            return previousHabits.map(h => ({ ...h, days: {} }));
          }
          return INITIAL_HABITS.map(h => ({ ...h, days: {} }));
        }, [allData, monthKey]);

        // Clean way to update just the current month's array
        const updateCurrentMonth = useCallback((updater) => {
          setAllData(prev => {
            const keys = Object.keys(prev).sort().reverse();
            const baseData = prev[monthKey] ? prev[monthKey] : (
              keys.length > 0 ? prev[keys[0]].map(h => ({ ...h, days: {} })) : INITIAL_HABITS.map(h => ({...h, days: {}}))
            );
            return {
              ...prev,
              [monthKey]: updater(baseData)
            };
          });
        }, [monthKey]);

        // Actions
        const updateHabitName = (id, newName) => {
          updateCurrentMonth(habits => habits.map(h => h.id === id ? { ...h, name: newName } : h));
        };
        const updateHabitGoal = (id, newGoal) => {
          updateCurrentMonth(habits => habits.map(h => h.id === id ? { ...h, goal: parseInt(newGoal) || 0 } : h));
        };
        const toggleDay = (id, day) => {
          updateCurrentMonth(habits => habits.map(h => h.id === id ? { ...h, days: { ...h.days, [day]: !h.days[day] } } : h));
        };
        const addHabit = () => {
          updateCurrentMonth(habits => [...habits, { id: `h_${Date.now()}`, name: "New Habit", goal: 10, days: {} }]);
        };
        const deleteHabit = (id) => {
          updateCurrentMonth(habits => habits.filter(h => h.id !== id));
        };

        return { data: currentData, updateHabitName, updateHabitGoal, toggleDay, addHabit, deleteHabit };
      }

      // --- Components ---

      function DailyTracker({ data, toggleDay, updateHabitName, updateHabitGoal, addHabit, deleteHabit, weeks, daysInMonth, selectedYear, selectedMonth }) {
        const totalCompleted = data.reduce((acc, h) => acc + calculateHabitStats(h).completed, 0);
        const totalGoals = data.reduce((acc, h) => acc + h.goal, 0);
        const overallProgress = totalGoals > 0 ? ((totalCompleted / totalGoals) * 100).toFixed(1) : 0;

        return (
          <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden flex flex-col">
            <div className="p-4 bg-teal text-white flex justify-between items-center">
              <h2 className="text-xl font-bold flex items-center gap-2">
                <span>Daily Habit Tracker</span>
              </h2>
              <div className="flex items-center gap-4">
                <div className="text-right">
                  <div className="text-sm opacity-80 uppercase tracking-wider">Overall Progress</div>
                  <div className="text-2xl font-bold">{overallProgress}%</div>
                </div>
                <div className="w-32 h-4 bg-black/20 rounded-full overflow-hidden border border-white/20 hidden sm:block">
                  <div className="h-full bg-accentRed transition-all duration-500" style={{ width: `${Math.min(100, overallProgress)}%` }}></div>
                </div>
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-sm text-center border-collapse">
                <thead>
                  <tr className="bg-gray-50 text-xs uppercase tracking-wider text-gray-500">
                    <th className="p-3 text-left w-64 min-w-[250px] sticky left-0 z-10 bg-gray-50 border-r-2 border-gray-200">Habits</th>
                    
                    {weeks.map((w, i) => (
                      <th key={w.label} colSpan={w.days.length} className={`p-2 border-r-2 border-gray-300 ${i % 2 === 0 ? 'bg-teal/5' : 'bg-gray-100'}`}>
                        {w.label}
                      </th>
                    ))}
                    
                    <th className="p-2 border-l-2 border-gray-300 bg-gray-50 w-20">Goal</th>
                    <th className="p-2 w-16 text-teal">Com</th>
                    <th className="p-2 w-16 text-salmon-dark">Left</th>
                    <th className="p-2 w-32 border-l border-gray-200">Progress</th>
                    <th className="p-2 w-10"></th>
                  </tr>
                  
                  <tr className="bg-white text-xs font-semibold border-b-2 border-gray-200">
                    <th className="p-2 sticky left-0 z-10 bg-white border-r-2 border-gray-200"></th>
                    
                    {weeks.map((w, i) => (
                      w.days.map((day, di) => {
                        const date = new Date(selectedYear, selectedMonth, day);
                        const dayName = SHORT_DAYS[date.getDay()];
                        return (
                          <th key={day} className={`p-1 min-w-[32px] border-b ${di === w.days.length - 1 ? 'border-r-2 border-gray-300' : 'border-r border-gray-100'} ${i % 2 === 0 ? 'bg-teal/5' : 'bg-gray-50'}`} title={`${MONTH_NAMES[selectedMonth]} ${day}, ${date.toLocaleDateString('en-US', {weekday: 'long'})}`}>
                            <div className="flex flex-col items-center">
                              <span className="text-[10px] text-gray-400 font-normal leading-tight">{dayName}</span>
                              <span className="text-gray-700">{day}</span>
                            </div>
                          </th>
                        );
                      })
                    ))}
                    
                    <td colSpan="5" className="bg-gray-50"></td>
                  </tr>
                </thead>
                <tbody>
                  {data.map((habit) => {
                    const stats = calculateHabitStats(habit);
                    return (
                      <tr key={habit.id} className="hover:bg-gray-50/50 transition-colors group">
                        <td className="p-2 text-left sticky left-0 z-10 bg-white border-r-2 border-gray-200 group-hover:bg-gray-50 shadow-[1px_0_0_0_#e5e7eb]">
                          <input 
                            type="text" 
                            value={habit.name}
                            onChange={(e) => updateHabitName(habit.id, e.target.value)}
                            className="w-full bg-transparent border-none outline-none focus:ring-1 focus:ring-teal rounded px-1 font-medium text-gray-700"
                          />
                        </td>

                        {weeks.map((w, wi) => (
                          w.days.map((day, di) => {
                            const isChecked = habit.days[day];
                            return (
                              <td 
                                key={day} 
                                onClick={() => toggleDay(habit.id, day)}
                                className={`p-0 aspect-square cursor-pointer transition-colors border-r
                                  ${di === w.days.length - 1 ? 'border-r-2 border-gray-300' : 'border-gray-100'}
                                  ${wi % 2 === 0 ? 'bg-teal/5' : ''}
                                  hover:bg-gray-200
                                `}
                              >
                                <div className={`w-full h-8 flex items-center justify-center m-auto ${isChecked ? 'bg-teal text-white shadow-inner' : 'transparent text-transparent'}`}>
                                  {isChecked && <CheckIcon />}
                                </div>
                              </td>
                            )
                          })
                        ))}

                        <td className="p-1 border-l-2 border-gray-300 font-semibold bg-gray-50">
                          <input 
                            type="number" 
                            value={habit.goal || ''}
                            onChange={(e) => updateHabitGoal(habit.id, e.target.value)}
                            className="w-full text-center bg-transparent border-none outline-none focus:ring-1 focus:ring-teal rounded p-1 font-bold text-gray-800"
                            min="1" max="31"
                          />
                        </td>
                        <td className="p-2 font-bold text-teal">{stats.completed}</td>
                        <td className="p-2 font-bold text-salmon-dark">{stats.left}</td>
                        <td className="p-2 border-l border-gray-200 relative">
                          <div className="flex items-center gap-2 w-full">
                            <span className="text-xs font-semibold w-10 text-right">{stats.progress.toFixed(0)}%</span>
                            <div className="flex-1 h-3 bg-gray-200 rounded-full overflow-hidden shadow-inner">
                              <div 
                                className="h-full transition-all duration-500 ease-out" 
                                style={{ width: `${Math.min(100, stats.progress)}%`, backgroundColor: getProgressBarColor(stats.progress) }}
                              ></div>
                            </div>
                          </div>
                        </td>
                        <td className="p-2 text-center">
                          <button 
                            onClick={() => deleteHabit(habit.id)}
                            className="text-gray-400 hover:text-accentRed transition-colors"
                            title="Delete Habit"
                          >
                            <TrashIcon />
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                  {data.length === 0 && (
                    <tr>
                      <td colSpan={5 + daysInMonth} className="p-8 text-center text-gray-500 font-medium italic">
                        No habits defined for this month. Add one below!
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>

            <div className="p-4 bg-gray-50 border-t border-gray-200 flex justify-between">
              <button 
                onClick={addHabit}
                className="flex items-center gap-2 px-4 py-2 bg-teal text-white rounded shadow hover:bg-teal-light transition-colors font-medium text-sm"
              >
                <PlusIcon /> Add New Habit
              </button>
              <div className="text-sm text-gray-500 flex items-center gap-4">
                <div className="flex items-center gap-1"><div className="w-3 h-3 bg-teal rounded-sm"></div> Done</div>
                <div className="flex items-center gap-1"><div className="w-3 h-3 bg-gray-100 border border-gray-200 rounded-sm"></div> Pending</div>
              </div>
            </div>
          </div>
        );
      }

      function OverviewDashboard({ data, weeks, daysInMonth, selectedMonth, selectedYear }) {
        if (!window.Recharts) {
          return <div className="p-8 text-center text-accentRed font-bold">Charts cannot be rendered because Recharts failed to load.</div>;
        }

        const dailyData = useMemo(() => {
          const result = [];
          for (let d = 1; d <= daysInMonth; d++) {
            let completedToday = 0;
            data.forEach(h => { if (h.days[d]) completedToday++; });
            const maxPossible = data.length;
            const percent = maxPossible > 0 ? (completedToday / maxPossible) * 100 : 0;
            
            result.push({
              day: `${MONTH_NAMES[selectedMonth]} ${d}`,
              completed: completedToday,
              percent: parseFloat(percent.toFixed(1))
            });
          }
          return result;
        }, [data, daysInMonth, selectedMonth]);

        const pieData = useMemo(() => {
          let totalCompleted = 0;
          let totalLeft = 0;
          data.forEach(h => {
            const stats = calculateHabitStats(h);
            totalCompleted += stats.completed;
            totalLeft += stats.left;
          });
          return [
            { name: 'Completed', value: totalCompleted },
            { name: 'Left', value: totalLeft }
          ];
        }, [data]);

        const PIE_COLORS = ['#2a7d7b', '#e8a09a'];

        const weeklyData = useMemo(() => {
          return weeks.map(week => {
            let c = 0;
            data.forEach(h => {
              week.days.forEach(d => { if (h.days[d]) c++; });
            });
            const g = data.length * week.days.length; 
            const percent = g > 0 ? (c / g) * 100 : 0;
            
            return {
              label: week.label,
              completed: c,
              goal: g,
              left: g - c,
              percent
            };
          });
        }, [data, weeks]);

        const totalGoalOverall = pieData[0].value + pieData[1].value;
        const totalPercentOverall = totalGoalOverall > 0 ? (pieData[0].value / totalGoalOverall) * 100 : 0;

        return (
          <div className="space-y-6 animate-in fade-in duration-500">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              <div className="lg:col-span-2 bg-white p-6 rounded-xl shadow border border-gray-200">
                <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center justify-between">
                  Daily Completion Trend
                  <span className="text-xs font-normal bg-teal/10 text-teal px-2 py-1 rounded">{MONTH_NAMES[selectedMonth]} {selectedYear}</span>
                </h3>
                <div className="h-72 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={dailyData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                      <defs>
                        <linearGradient id="colorPercent" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor="#2a7d7b" stopOpacity={0.8}/>
                          <stop offset="95%" stopColor="#2a7d7b" stopOpacity={0}/>
                        </linearGradient>
                      </defs>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e5e7eb" />
                      <XAxis dataKey="day" tick={{fontSize: 12, fill: '#6b7280'}} tickLine={false} axisLine={false} tickMargin={10} minTickGap={20}/>
                      <YAxis tick={{fontSize: 12, fill: '#6b7280'}} tickLine={false} axisLine={false} domain={[0, 100]} />
                      <Tooltip 
                        contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }}
                        formatter={(val) => [`${val}%`, 'Completion']}
                      />
                      <Area type="monotone" dataKey="percent" stroke="#2a7d7b" strokeWidth={3} fillOpacity={1} fill="url(#colorPercent)" />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>

              <div className="bg-white p-6 rounded-xl shadow border border-gray-200 flex flex-col items-center">
                <h3 className="text-lg font-bold text-gray-800 mb-2 w-full border-b pb-2 text-left">Hit / Miss Ratio</h3>
                <div className="flex-1 w-full relative flex items-center justify-center min-h-[250px]">
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie
                        data={pieData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value" stroke="none"
                      >
                        {pieData.map((entry, index) => <Cell key={`cell-${index}`} fill={PIE_COLORS[index % PIE_COLORS.length]} />)}
                      </Pie>
                      <Tooltip formatter={(value) => [value, 'Days Checkmarks']} contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }}/>
                    </PieChart>
                  </ResponsiveContainer>
                  <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                    <span className="text-3xl font-black text-gray-800">
                      {Math.round(totalPercentOverall)}%
                    </span>
                    <span className="text-xs text-gray-500 font-medium uppercase tracking-wider">Done</span>
                  </div>
                </div>
                <div className="flex justify-center gap-6 mt-2 w-full">
                  <div className="flex items-center gap-2">
                    <div className="w-3 h-3 rounded-full bg-teal"></div>
                    <span className="text-sm text-gray-600 font-medium">Completed ({pieData[0].value})</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="w-3 h-3 rounded-full bg-salmon"></div>
                    <span className="text-sm text-gray-600 font-medium">Left ({pieData[1].value})</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-xl shadow border border-gray-200">
              <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Weekly Performance Summary</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-center border-separate border-spacing-0 border rounded-lg overflow-hidden">
                  <thead>
                    <tr className="bg-gray-50">
                      <th className="p-3 text-left border-b border-r text-gray-500 text-xs uppercase tracking-wider">Metric</th>
                      {weeklyData.map(w => (
                        <th key={w.label} className="p-3 border-b border-r text-gray-700 font-bold min-w-[120px]">{w.label}</th>
                      ))}
                      <th className="p-3 border-b text-teal font-bold min-w-[140px] bg-teal/5">Total Month</th>
                    </tr>
                  </thead>
                  <tbody className="text-sm font-medium">
                    <tr>
                      <td className="p-3 text-left border-b border-r text-gray-600">Completed</td>
                      {weeklyData.map((w, i) => <td key={i} className="p-3 border-b border-r text-teal">{w.completed}</td>)}
                      <td className="p-3 border-b bg-teal/5 text-teal font-bold">{pieData[0].value}</td>
                    </tr>
                    <tr>
                      <td className="p-3 text-left border-b border-r text-gray-600">Goal (Max Possible)</td>
                      {weeklyData.map((w, i) => <td key={i} className="p-3 border-b border-r">{w.goal}</td>)}
                      <td className="p-3 border-b bg-teal/5 font-bold">{totalGoalOverall}</td>
                    </tr>
                    <tr>
                      <td className="p-3 text-left border-b border-r text-gray-600">Left</td>
                      {weeklyData.map((w, i) => <td key={i} className="p-3 border-b border-r text-salmon-dark">{w.left}</td>)}
                      <td className="p-3 border-b bg-teal/5 text-salmon-dark font-bold">{pieData[1].value}</td>
                    </tr>
                    
                    <tr className="bg-gray-50/50">
                      <td className="p-3 text-left border-r text-gray-800 font-bold">Progress</td>
                      {weeklyData.map((w, i) => (
                        <td key={i} className="p-4 border-r align-bottom">
                          <div className="text-xs text-gray-500 mb-1 font-bold">{w.completed} / {w.goal} <span className="text-gray-400">({w.percent.toFixed(1)}%)</span></div>
                          <div className="w-full h-2 bg-gray-200 rounded-full overflow-hidden shadow-inner">
                            <div className="h-full" style={{ width: `${w.percent}%`, backgroundColor: getProgressBarColor(w.percent) }}></div>
                          </div>
                        </td>
                      ))}
                      <td className="p-4 bg-teal/5 align-bottom">
                        <div className="text-xs font-black text-teal mb-1">{pieData[0].value} / {totalGoalOverall} <span className="opacity-75">({totalPercentOverall.toFixed(1)}%)</span></div>
                        <div className="w-full h-2 bg-gray-200 rounded-full overflow-hidden shadow-inner">
                          <div className="h-full bg-teal transition-all" style={{ width: `${totalPercentOverall}%` }}></div>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [selectedYear, setSelectedYear] = useState(2026);
        const [yearInputVal, setYearInputVal] = useState("2026");
        const [selectedMonth, setSelectedMonth] = useState(2); // 0-indexed = March
        
        const { data, updateHabitName, updateHabitGoal, toggleDay, addHabit, deleteHabit } = useHabitData(selectedYear, selectedMonth);
        const [activeTab, setActiveTab] = useState('daily');

        const weeks = useMemo(() => generateWeeks(selectedYear, selectedMonth), [selectedYear, selectedMonth]);
        const daysInMonth = useMemo(() => getDaysInMonth(selectedYear, selectedMonth), [selectedYear, selectedMonth]);
        const simpleWeeks = useMemo(() => generateSimpleWeeks(daysInMonth), [daysInMonth]);

        const applyYear = () => {
          const y = parseInt(yearInputVal);
          if (!isNaN(y) && y >= 1900 && y <= 2100) {
            setSelectedYear(y);
          } else {
            setYearInputVal(selectedYear.toString());
          }
        };

        const handleYearKeyDown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            e.target.blur();
          }
        };

        return (
          <div className="min-h-screen flex flex-col bg-lightBg text-gray-800">
            <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
              <div className="max-w-[1600px] mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-teal to-teal-light flex items-center justify-center shadow-md">
                    <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
                  </div>
                  <h1 className="text-xl font-black tracking-tight text-gray-800 hidden sm:block">Habit<span className="text-teal">Flow</span></h1>
                </div>

                <div className="flex bg-gray-100 p-1 rounded-lg">
                  <button 
                    onClick={() => setActiveTab('daily')}
                    className={`px-4 py-1.5 text-sm font-semibold rounded-md transition-all ${activeTab === 'daily' ? 'bg-white text-teal shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                  >
                    Daily Habits
                  </button>
                  <button 
                    onClick={() => setActiveTab('overview')}
                    className={`px-4 py-1.5 text-sm font-semibold rounded-md transition-all ${activeTab === 'overview' ? 'bg-white text-teal shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                  >
                    Overview Dashboard
                  </button>
                </div>

                <div className="flex items-center bg-gray-100 rounded-lg px-2 py-1 border border-gray-200 shadow-inner group transition-all focus-within:ring-2 focus-within:ring-teal/30">
                  <svg className="w-4 h-4 text-teal mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                  
                  <select 
                    value={selectedMonth} 
                    onChange={e => setSelectedMonth(parseInt(e.target.value))}
                    className="bg-transparent border-none outline-none text-sm font-bold text-gray-800 cursor-pointer p-1 hover:text-teal transition-colors"
                  >
                    {MONTH_NAMES.map((m, i) => <option key={i} value={i}>{m}</option>)}
                  </select>

                  <input 
                    type="number" 
                    value={yearInputVal}
                    onChange={e => setYearInputVal(e.target.value)}
                    onBlur={applyYear}
                    onKeyDown={handleYearKeyDown}
                    className="bg-transparent border-none outline-none text-sm font-bold text-gray-800 w-14 text-center p-1 focus:bg-white focus:shadow-sm rounded transition-colors"
                  />
                </div>
              </div>
            </header>

            <main className="flex-1 w-full max-w-[1600px] mx-auto p-4 md:p-6 pb-20 overflow-x-hidden">
              {activeTab === 'daily' ? (
                <DailyTracker 
                  data={data} 
                  toggleDay={toggleDay}
                  updateHabitName={updateHabitName}
                  updateHabitGoal={updateHabitGoal}
                  addHabit={addHabit}
                  deleteHabit={deleteHabit}
                  weeks={simpleWeeks}
                  daysInMonth={daysInMonth}
                  selectedMonth={selectedMonth}
                  selectedYear={selectedYear}
                />
              ) : (
                <OverviewDashboard 
                  data={data} 
                  weeks={weeks}
                  daysInMonth={daysInMonth}
                  selectedMonth={selectedMonth}
                  selectedYear={selectedYear}
                />
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
